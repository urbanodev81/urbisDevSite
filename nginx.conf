server {
    listen 80;
    server_name urbisdev.tech www.urbisdev.tech *.urbisdev.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name urbisdev.tech www.urbisdev.tech *.urbisdev.tech;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Página de erro — 17/10/2026.
    #
    # Erro gerado AQUI, e não no Laravel (foto que não existe em /storage,
    # arquivo oculto negado, `.php` que não é o index), saía como a página
    # crua do nginx: "404 Not Found", fundo branco, sem marca. O visitante do
    # site da imobiliária via isso no lugar da página do site. Agora o erro
    # volta ao Laravel, que responde com a 404 do próprio site.
    #
    # Só para quem pede página (`Accept` com text/html). Uma `<img>` quebrada
    # fica com o 404 curto do nginx: ninguém o vê, e mandar a página inteira
    # (70 a 220 KB, com SSR) a cada foto que falta pesaria no PHP à toa.
    #
    # O `=` adota o status que o Laravel devolver. O 403 do arquivo oculto
    # também sai 404, o que não confirma que o `.env` existe.
    error_page 403 404 = @laravel;

    location @laravel {
        if ($http_accept !~* "text/html") {
            return 404;
        }
        rewrite ^ /index.php last;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        # Só o index.php é porta de entrada (é o único `.php` em public/). Outro
        # `.php`, como o wp-login.php que os robôs testam, respondia o
        # "File not found." cru do FPM; agora vira o 404 do error_page acima.
        if ($uri != /index.php) {
            return 404;
        }
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
