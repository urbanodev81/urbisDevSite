# Site institucional -- ambiente de TESTE (19/08/2026).
#
# Por que existe: publicar no urbisdev.tech e' `git push` na `pre-prod`, e
# aquilo dispara o CD. A pagina nova (/como-trabalhamos) precisava ser vista
# antes de virar site publico -- entao a branch de trabalho roda aqui, num
# endereco proprio, atras de senha.
#
# Mesmo muro de Basic Auth dos tiers dev dos seis sistemas, e aqui ele pesa
# tanto quanto no Movana: um SITE INSTITUCIONAL duplicado e indexavel divide
# a autoridade do dominio de verdade com uma copia -- o buscador escolhe
# sozinho qual mostrar, e nao ha como pedir que ele escolha certo depois.
#
# Proxy para o nginx do container em 127.0.0.1:8125 (ver
# ~/site-dev/docker-compose.vps-dev.yml).
server {
    server_name site-dev.urbisdev.tech;

    access_log /var/log/nginx/site-dev-access.log;

    location / {
        auth_basic "Acesso restrito - equipe";
        auth_basic_user_file /etc/nginx/.htpasswd-dev;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        proxy_pass http://127.0.0.1:8125;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
