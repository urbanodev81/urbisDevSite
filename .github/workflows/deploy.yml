name: Deploy — UrbisDev Site

# PLANO B, pelo botão "Run workflow" — NÃO é este arquivo que publica no push.
#
# Desde 15/10/2026 quem faz o push na `pre-prod` virar deploy é o vigia da VPS
# (`~/publicar.sh --vigiar`, no cron a cada 2 min; versionado em
# `socrates/scripts/publicar-vps.sh`, receita `site_prod`). Ele faz `git pull`
# em `~/site` e roda os mesmos passos que este arquivo rodava: build antes de
# trocar, `up -d`, `composer install`, permissões de `storage`, `nginx -t` e
# reload. O rsync acabou — a pasta da VPS é um clone, sem o
# `docker-compose.override.yml` (sparse checkout).
#
# O gatilho de push saiu porque a cota de Actions da conta acabou em 10/10/2026
# (pendência 214). Este workflow fica para publicar pelo site do GitHub quando
# houver cota — chama a mesma porta (`publicar urbisdev prod`), com a chave que
# não tem shell (segredo `VPS_PUBLICAR_KEY`, o mesmo dos irmãos).
#
# Sem GitHub, de qualquer terminal seu:
#   ssh urbisdev-vps '~/publicar.sh urbisdev prod'
# Passo a passo: `socrates/docs/20-runbook-deploy.md`.

on:
  workflow_dispatch:

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    name: Publica na VPS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publica
        env:
          VPS_PUBLICAR_KEY: ${{ secrets.VPS_PUBLICAR_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_PUBLICAR_KEY" > ~/.ssh/publicar && chmod 600 ~/.ssh/publicar
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "Publicando urbisdev/prod em ${GITHUB_SHA::7}"
          ssh -i ~/.ssh/publicar -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "$VPS_USER@$VPS_HOST" "publicar urbisdev prod $GITHUB_SHA"
