# Cópia versionada de /etc/nginx/sites-available/urbisdev.conf (nginx do HOST),
# desde 18/10/2026. O original vive na VPS: mudou um lado, mude o outro.

server {
    listen 80;
    server_name urbisdev.tech www.urbisdev.tech;
    return 301 https://$host$request_uri;
}

server {
    include /etc/nginx/snippets/erro-50x.conf;
    listen 443 ssl;
    server_name urbisdev.tech www.urbisdev.tech;

    # 18/10/2026 (pendência 136). Zonas em /etc/nginx/conf.d/limite-requisicoes.conf
    # (cópia em socrates/infra/nginx-host/conf.d/). A rajada de 60 cobre uma
    # página inteira com folga; o POST (contato, lead, pergunta à IA) tem teto
    # próprio, e o relato de CSP não conta nele.
    limit_req zone=por_ip burst=60 nodelay;
    limit_req zone=post_por_ip burst=10 nodelay;

    ssl_certificate /etc/letsencrypt/live/urbisdev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/urbisdev.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

